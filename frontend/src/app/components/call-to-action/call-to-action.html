<section class="cta-section">
  <div class="section-header">
    <h2>Recent Call to Actions</h2>
  </div>

  <div class="table-container">
    @if (recentCtas.length === 0) {
      <div class="empty-state">
        <p>No recent call to actions found.</p>
      </div>
    } @else {
      <table mat-table [dataSource]="recentCtas" class="cta-table">
        
        <ng-container matColumnDef="documentName">
          <th mat-header-cell *matHeaderCellDef>Document</th>
          <td mat-cell *matCellDef="let cta" class="filename-cell">
            <span class="filename" [title]="cta.documentName">{{ cta.documentName }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Action Required</th>
          <td mat-cell *matCellDef="let cta">{{ cta.action }}</td>
        </ng-container>

        <ng-container matColumnDef="priority">
          <th mat-header-cell *matHeaderCellDef>Priority</th>
          <td mat-cell *matCellDef="let cta">
            <span class="badge" [class]="'priority-' + cta.priority.toLowerCase()">
              {{ cta.priority }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let cta">
            {{ cta.date }}
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    }
  </div>
</section>
