<div class="parent">
  <header class="header">
    <h1>Project_Z</h1>
  </header>
  <main class="content">
    <h2>Welcome back, {{ name() }}</h2>

    <span>Email:</span>
    <p>{{ email() }}</p>

    <span>User ID:</span>

  </div>
</div>
