<div class="login-container">
  <div class="login-card">
    <h1>Login</h1>
    <p class="subtitle">Login to get Started</p>
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <mat-form-field appearance="outline">
        <mat-label> Username </mat-label>
        <input matInput type="email" placeholder="user@example.com" formControlName="email" />
        @if (this.loginForm.controls.email.hasError('required')) {
          <mat-error>Email is required</mat-error>
        }
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label> Password </mat-label>
        <input matInput type="password" formControlName="password" />
        @if (this.loginForm.controls.password.hasError('required')) {
          <mat-error>Password is required</mat-error>
        }
      </mat-form-field>
      <button mat-raised-button type="button" class="login-button">Login</button>
      <div class="signup-link">
        <span>Don't have an account?</span>
        <button mat-button type="button" routerLink="/signup">Signup</button>
      </div>
    </form>
  </div>
</div>
