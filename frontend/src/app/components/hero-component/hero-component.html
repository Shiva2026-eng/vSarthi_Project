<div class="dashboard-container">
  <app-sidebar
    [userProfile]="userProfile()"
    [isFetchingEmails]="isFetchingEmails()"
    [isLoadingProfile]="isLoadingProfile()"
    [isCallToActionRoute]="isCallToActionRoute()"
    (uploadClicked)="openUploadModal()"
    (connectOutlookClicked)="connectOutlook()"
    (fetchEmailsClicked)="fetchOutlookEmails()"
    (backToDashboardClicked)="navigateToDashboard()"
    (logoutClicked)="logout()"
  >
  </app-sidebar>

  <main class="main-content">
    @if (errorMessage()) {
      <div class="alert alert-error">
        {{ errorMessage() }}
        <button class="close-btn" (click)="errorMessage.set(null)">×</button>
      </div>
    }

    @if (!outlet.isActivated) {
      <app-dashboard-stats
        [totalDocuments]="totalDocuments()"
        [processingDocuments]="processingDocuments()"
        [completedDocuments]="completedDocuments()"
        [isOutlookConnected]="userProfile()?.connected_account?.outlook || false"
      >
      </app-dashboard-stats>
      <app-documents-table
        [documents]="documents()"
        [processingDocs]="processingDocs()"
        [isLoadingDocuments]="isLoadingDocuments()"
        (refreshClicked)="fetchDocuments()"
        (uploadClicked)="openUploadModal()"
        (processClicked)="processDocument($event)"
        (viewResultClicked)="viewResult($event)"
      >
      </app-documents-table>
    }

    <router-outlet #outlet="outlet"></router-outlet>
  </main>
</div>

@defer (when isUploadModalOpen()) {
  <app-upload-modal
    [isOpen]="isUploadModalOpen()"
    [selectedFile]="selectedFile()"
    [isUploading]="isUploading()"
    (closeModal)="closeUploadModal()"
    (fileSelected)="onFileSelected($event)"
    (uploadClicked)="uploadDocument()"
  >
  </app-upload-modal>
}

@defer (when isResultModalOpen()) {
  <app-result-modal
    [isOpen]="isResultModalOpen()"
    [selectedResult]="selectedResult()"
    [isLoadingResult]="isLoadingResult()"
    (closeModal)="closeResultModal()"
  >
  </app-result-modal>
}
