<div class="main-container">
  <app-dashboard
    [name]="name()"
    [email]="email()"
    [id]="id()"
    [created_at]="created_at()"
  ></app-dashboard>

  <div class="docs">
    <app-connected-services
      [connectedAccounts]="connected_accounts"
      [loadingOutlookMessages]="loadingOutlookMessages"
      (connectOutlook)="connectOutlook()"
      (fetchOutlookEmails)="fetchOutlookEmails()"
    ></app-connected-services>

    <app-documents-table
      [documents]="documents"
      [processingDocIds]="processingDocIds"
      (toggleModal)="toggleModal()"
      (sendForProcessing)="sendForProcessing($event)"
      (viewSummary)="viewSummary($event)"
    ></app-documents-table>
  </div>
</div>

<app-file-upload-modal
  [showModal]="showModal"
  (toggleModal)="toggleModal()"
  (fileUploaded)="onFileUploaded()"
></app-file-upload-modal>

<app-outlook-drawer-modal
  [showDrawer]="showOutlookDrawer"
  [outlookMessages]="outlookMessages()"
  [ingestingMessageId]="ingestingMessageId"
  [ingestingAllEmails]="ingestingAllEmails"
  (closeDrawer)="closeOutlookDrawer()"
  (importEmail)="importEmailBody($event)"
  (importAll)="importAllEmails()"
></app-outlook-drawer-modal>
